name: Testing Jar and Docker image (amd64 + armv7)

on: push

jobs:
  if: false  # This disables the entire workflow
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Get tag name
        id: tag
        run: echo "NAME=testing" >> $GITHUB_OUTPUT

      - uses: actions/checkout@v3.5.3

      - name: Use tag name as IDS frontend version and Docker tag name
        uses: jacobtomlinson/gha-find-replace@0.1.2
        with:
          include: "package.json"
          find: '"0.0.0"'
          replace: '"${{ steps.tag.outputs.NAME }}"'

      - name: Install Node 18
        uses: actions/setup-node@v2.1.4
        with:
          node-version: 18

      - name: Install Angular CLI 18
        run: sudo npm install -g @angular/cli@18.2.20

      - name: Component versions
        run: node -v && npm -v

      # --force to solve:
      #
      # Found: @angular-devkit/build-angular@0.1002.1
      # node_modules/@angular-devkit/build-angular
      #   dev @angular-devkit/build-angular@"^18.2.20" from the root project
      #
      # Could not resolve dependency:
      # dev @angular-devkit/build-angular@"^18.2.20" from the root project
      #
      # Conflicting peer dependency: typescript@5.5.4
      # node_modules/typescript
      #   peer typescript@">=5.4 <5.6" from @angular-devkit/build-angular@18.2.20
      #   node_modules/@angular-devkit/build-angular
      #     dev @angular-devkit/build-angular@"^18.2.20" from the root project
      #
      # Fix the upstream dependency conflict, or retry
      # this command with --force or --legacy-peer-deps
      # to accept an incorrect (and potentially broken) dependency resolution.
      - name: Install dependencies
        run: npm i --force

      - name: Build IDS frontend
        run: ng build --configuration production --localize

      - name: Remove node modules directory
        run: rm -r node_modules

      - name: Setup Docker QEMU
        uses: docker/setup-qemu-action@v1.2.0
        with:
          platforms: linux/amd64,linux/arm/v7

      - name: Setup Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@v1.6.0

      - name: Login to DockerHub
        uses: docker/login-action@v1.12.0
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Build and push Docker image to registry
        uses: docker/build-push-action@v6.18.0
        with:
          builder: ${{ steps.buildx.outputs.name }}
          context: .
          file: Dockerfile
          platforms: linux/amd64,linux/arm/v7
          push: true
          tags: cyosp/${{ github.event.repository.name }}:${{ steps.tag.outputs.NAME }}
